<h1>RETO 5</h1>

<div class="formulario">
  <input type="text" placeholder="Nombre" [(ngModel)]="nombre">
  <input type="number" placeholder="Cantidad" min="1" [(ngModel)]="cantidad">
  <input type="number" placeholder="Precio" min="0" [(ngModel)]="precio">
  <button (click)="agregar()">Agregar</button>
</div>

@if (mensajeError) {
  <p class="error">{{ mensajeError }}</p>
}

<table>
  <thead>
    <tr>
      <th>Nombre</th>
      <th>Cantidad</th>
      <th>Precio</th>
      <th>Total</th>
      <th></th>
    </tr>
  </thead>
  <tbody>
    @for (p of productos; track $index) {
      <tr>
        <td>{{ p.nombre }}</td>
        <td>{{ p.cantidad }}</td>
        <td>{{ p.precio }}</td>
        <td>{{ totalProducto(p) }}</td>
        <td><button (click)="eliminar($index)">Eliminar</button></td>
      </tr>
    } @empty {
      <tr>
        <td colspan="5">Aún no hay productos registrados.</td>
      </tr>
    }
  </tbody>
</table>

<h3>Total general: {{ totalGeneral }}</h3>
